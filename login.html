<!DOCTYPE html>
<html lang="en" data-theme="light" data-font-size="md">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — SAT Grammar Lab</title>
<meta name="description" content="Sign in to your SAT Grammar Lab account.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://example.com/login.html">

<meta property="og:type" content="website">
<meta property="og:title" content="Sign in — SAT Grammar Lab">
<meta property="og:description" content="Sign in to your SAT Grammar Lab account.">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="stylesheet" href="main.css">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('satgl.theme')||'"system"');var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.dataset.fontSize=JSON.parse(localStorage.getItem('satgl.fontSize')||'"md"');}catch(e){}})();</script>
</head>

<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div id="site-header"></div>

<main id="main" tabindex="-1">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-card__title">Welcome back</h1>
      <p class="auth-card__sub">Pick up where you left off.</p>

      <div id="form-alert" hidden></div>

      <form id="login-form" class="stack" novalidate>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" type="email" id="email" name="email"
                 autocomplete="email" required aria-describedby="email-error">
          <p class="field__error" id="email-error" hidden></p>
        </div>

        <div class="field">
          <div class="row-between">
            <label class="label" for="password">Password</label>
            <button class="btn btn-ghost btn-sm" type="button" id="forgot-btn">Forgot?</button>
          </div>
          <input class="input" type="password" id="password" name="password"
                 autocomplete="current-password" required aria-describedby="password-error">
          <p class="field__error" id="password-error" hidden></p>
        </div>

        <label class="check">
          <input type="checkbox" id="remember" checked>
          <span>Keep me signed in on this device</span>
        </label>

        <button class="btn btn-primary btn-block btn-lg" type="submit" id="submit-btn">Sign in</button>
      </form>

      <div class="auth-divider">or</div>

      <button class="btn btn-block" type="button" id="magic-link-btn">Email me a sign-in link</button>

      <p class="text-center mt-6 text-sm muted">
        New here? <a href="register.html">Create a free account</a>
      </p>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script type="module" src="page-login.js"></script>
</body>
</html>
